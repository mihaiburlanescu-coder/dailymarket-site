<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dezabonare · Daily Market</title><meta name="robots" content="noindex"><link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#EEF1F5;--card:#fff;--ink:#13223A;--muted:#5A6B82;--line:#D5DCE6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1420;--card:#131F31;--ink:#E7EDF5;--muted:#93A3B8;--line:#24344C}}
:root[data-theme="dark"]{--bg:#0C1420;--card:#131F31;--ink:#E7EDF5;--muted:#93A3B8;--line:#24344C}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,Segoe UI,Arial,sans-serif;line-height:1.6}
header{background:#13223A}header a{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:800;font-size:20px;max-width:560px;margin:0 auto;padding:12px 16px}
main{max-width:560px;margin:40px auto;padding:0 16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px}
h1{font-size:24px;margin:0 0 10px}#m{font-size:16px}.muted{color:var(--muted);font-size:14px}a.btn{display:inline-block;margin-top:14px;background:#D9A441;color:#13223A;font-weight:700;text-decoration:none;padding:10px 16px;border-radius:999px}
</style></head><body>
<header><a href="./?lang=ro"><svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#D9A441"/><rect x="7" y="13" width="4" height="12" rx="1" fill="#13223A"/><rect x="14" y="7" width="4" height="18" rx="1" fill="#13223A"/><rect x="21" y="16" width="4" height="9" rx="1" fill="#13223A"/></svg>Daily Market</a></header>
<main><div class="card"><h1>Dezabonare</h1><p id="m">Te dezabonăm…</p><p class="muted" id="again" hidden>Te-ai răzgândit? Te poți abona din nou oricând de pe site.</p><a class="btn" href="./?lang=ro">Înapoi la Daily Market</a></div></main>
<script>
(async () => {
  const m = document.getElementById("m");
  const tok = new URLSearchParams(location.search).get("t") || "";
  if (!/^[0-9a-f-]{36}$/i.test(tok)) { m.textContent = 'Linkul nu este valid sau a expirat. Scrie-ne la contact@dailymarketlab.com și te dezabonăm noi.'; return; }
  try {
    const r = await fetch("https://atlxahrvzhzrzfhmwwen.supabase.co/rest/v1/rpc/dm_unsubscribe", { method: "POST",
      headers: { "Content-Type": "application/json", apikey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0bHhhaHJ2emh6cnpmaG13d2VuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0ODk2MTUsImV4cCI6MjEwODA2NTYxNX0.1lOoTQP6CYoT-qDg2oGx6EbtJP9ag2CaCxmV3Bj3DhQ", Authorization: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0bHhhaHJ2emh6cnpmaG13d2VuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0ODk2MTUsImV4cCI6MjEwODA2NTYxNX0.1lOoTQP6CYoT-qDg2oGx6EbtJP9ag2CaCxmV3Bj3DhQ" },
      body: JSON.stringify({ t: tok }) });
    if (!r.ok) throw new Error(r.status);
    const ok = await r.json();
    m.textContent = ok ? 'Gata, te-ai dezabonat. Nu mai primești emailuri de la Daily Market.' : 'Linkul nu este valid sau a expirat. Scrie-ne la contact@dailymarketlab.com și te dezabonăm noi.';
    if (ok) document.getElementById("again").hidden = false;
  } catch (e) { m.textContent = 'Nu am reușit acum. Mai încearcă o dată sau scrie-ne la contact@dailymarketlab.com.'; }
})();
</script></body></html>
